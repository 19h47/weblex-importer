name: Tests

on:
  push:
    branches: [wordpress-plugin]
  pull_request:

# One run per branch: a push cancels the one still running for the push before.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  phpunit:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: weblex_importer_tests
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping -proot" --health-interval=5s --health-timeout=5s --health-retries=20
    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
          tools: composer

      # The dependencies of composer.lock, from the cache of Composer once downloaded.
      - uses: ramsey/composer-install@v3

      - run: composer test
